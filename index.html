    <!-- Boot watchdog (plain ES5, runs before the module so it also covers a
         script that never loads / parses): if the game has not shown its
         first screen and nothing has moved for a while (the version choice
         of the first launch excluded), or main() failed, show « Le jeu
         n'a pas pu démarrer » + the error + Réessayer / Réinitialiser le cache
         (service worker + caches only: saves in localStorage are kept).
         « Moved »: the loading bar, or a download finishing (only up to 60 s
         after the main script ran: background downloads must not hide a
         stuck main() forever). The limit is 10 s once the main script has
         run (DOMContentLoaded comes after the module scripts), 25 s before:
         a slow first download of the big script is not a failure (UX-20).
         main.ts calls window.__rsBootOk() (first screen up) and
         window.__rsBootFail(err) (boot rejected). -->

      (function () {
        var errs = [];
        var done = false;
        var shown = null;
        var lastPct = '';
        var lastMove = Date.now();
        function txt(e) {
          if (!e) return 'inconnue';
          if (e.stack) return String(e.stack).slice(0, 600);
          if (e.message) return String(e.message);
          return String(e);
        }
        window.addEventListener('error', function (ev) {
          if (done) return;
          var m = ev && (ev.error ? txt(ev.error) : ev.message);
          if (!m && ev && ev.target && ev.target.src) m = 'Ressource introuvable : ' + ev.target.src;
          if (m && m !== 'Script error.') errs.push(m);
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          if (!done) errs.push(txt(ev && ev.reason));

        function resetCache() {
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)

                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));

          try {
            if (window.caches && caches.keys)
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
          } catch (e) {}
          var go = function () { location.reload(); };
          Promise.all(jobs).then(go, go);
          setTimeout(go, 3000);
        }
        function show(extra) {
          if (done) return;
          if (extra) errs.push(extra);
          if (!shown) {
            shown = document.createElement('div');
            shown.id = 'boot-error';
            shown.setAttribute('role', 'alert');
            shown.style.cssText = 'position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(10,12,18,.94);color:#e8dcbe;font:15px Georgia,serif;';
            var box = document.createElement('div');
            box.style.cssText = 'max-width:560px;width:100%;max-height:100%;overflow:auto;text-align:center;';
            var h = document.createElement('div');
            h.textContent = "Le jeu n'a pas pu démarrer";
            h.style.cssText = 'font-size:22px;color:#e4c16a;margin-bottom:10px;';
            var pre = document.createElement('pre');
            pre.id = 'boot-error-msg';
            pre.style.cssText = 'text-align:left;white-space:pre-wrap;word-break:break-word;font:12px monospace;color:#d98a8a;background:#14161f;padding:8px;border-radius:6px;max-height:40vh;overflow:auto;';
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;';
            var mk = function (label, fn) {
              var b = document.createElement('button');
              b.type = 'button';
              b.textContent = label;
              b.style.cssText = 'font:16px Georgia,serif;padding:10px 18px;border-radius:6px;border:2px solid #d9a441;background:#2c1d12;color:#f2e6c8;cursor:pointer;';
              b.addEventListener('click', fn);
              row.appendChild(b);
            };
            mk('Réessayer', function () { location.reload(); });
            mk('Réinitialiser le cache', resetCache);
            box.appendChild(h);
            box.appendChild(pre);
            box.appendChild(row);
            shown.appendChild(box);
            document.body.appendChild(shown);
          }
          var msg = errs.length ? errs.slice(-4).join('\n\n') : 'Le chargement ne progresse plus (réseau ou cache bloqué).';

          done = true;
          if (shown) shown.remove();
        };
        window.__rsBootFail = function (err) {
          show(txt(err));
        };
        // The main script has run (module scripts execute before DOMContentLoaded).
        var started = 0;
        document.addEventListener('DOMContentLoaded', function () {
          started = Date.now();
          lastMove = started;

        // A download that just finished (script chunk, manifest, image) is progress too,
        // until 60 s after the main script ran (then only the loading bar counts).
        try {
          new PerformanceObserver(function () {
            var now = Date.now();
            if (!started || now - started < 60000) lastMove = now;
          }).observe({ type: 'resource', buffered: false });
        } catch (e) {}
        var timer = setInterval(function () {
          if (done) return clearInterval(timer);
          var boot = document.getElementById('boot');
          if (!boot) return;
          var mode = document.getElementById('boot-mode');
          var pct = (document.getElementById('boot-fill') || {}).style;
          var now = Date.now();
          var p = pct ? pct.width : '';
          // Waiting on the first-launch version choice is not a failure.
          // A hidden tab throttles timers: its time doesn't count (audit 03 §1).
          if (document.hidden || p !== lastPct || (mode && mode.className.indexOf('ask') >= 0) || document.querySelector('.rs-modal')) {
            lastPct = p;
            lastMove = now;
          }
          if (now - lastMove >= (started ? 10000 : 25000)) show();
        }, 1000);
      })();
